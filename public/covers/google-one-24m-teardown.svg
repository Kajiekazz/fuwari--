    </pattern>

    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.015"/>
    </pattern>

    <filter id="blurWide" x="-90%" y="-90%" width="280%" height="280%">
