<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Timeline diagram: a solid cyan phase ends at a red wall, the rest is dashed and shatters">
  <defs>
    <radialGradient id="bg" cx="50%" cy="51%" r="78%">
      <stop offset="0%" stop-color="#0d2036"/>
      <stop offset="45%" stop-color="#07121f"/>
      <stop offset="100%" stop-color="#03060b"/>
    </radialGradient>

    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13e2f4" stop-opacity="0.34"/>
      <stop offset="38%" stop-color="#2ae4f5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2ae4f5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="spillMask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="12%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="spillClip">
      <rect x="56" y="326" width="500" height="128" fill="url(#spillMask)"/>
    </mask>

    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="596" y2="0">
      <stop offset="0%" stop-color="#19c9dc" stop-opacity="0.15"/>
      <stop offset="9%" stop-color="#22dcef" stop-opacity="1"/>
      <stop offset="92%" stop-color="#2fe6f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8df6ff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="dashFade" gradientUnits="userSpaceOnUse" x1="596" y1="0" x2="900" y2="0">
      <stop offset="0%" stop-color="#2fe6f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#22c9dd" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1aa8bc" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="wall" gradientUnits="userSpaceOnUse" x1="0" y1="92" x2="0" y2="568">
      <stop offset="0%" stop-color="#ff4a24" stop-opacity="0"/>
      <stop offset="11%" stop-color="#ff3d16" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ff5a2a" stop-opacity="1"/>
      <stop offset="89%" stop-color="#ff3d16" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff4a24" stop-opacity="0"/>
